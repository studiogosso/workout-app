<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<meta name="theme-color" content="#0a0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a16;--bg2:rgba(18,18,42,.7);--bg3:rgba(26,26,62,.6);--bg4:rgba(34,34,74,.5);
  --glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);
  --accent:#e17055;--accent2:#ff8a65;--accent-glow:rgba(225,112,85,.25);
  --green:#00b894;--gold:#ffd700;--red:#ff6b6b;--blue:#74b9ff;--purple:#a29bfe;
  --text:#e8e8f0;--text2:#9090b0;--text3:#606080;
  --radius:16px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
html,body{height:100%;font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{background-image:
  radial-gradient(ellipse at 20% 0%,rgba(225,112,85,.06) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 100%,rgba(162,155,254,.06) 0%,transparent 50%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;background:var(--bg3);backdrop-filter:blur(8px);color:var(--text);border:1px solid var(--glass-border);border-radius:10px;padding:8px 12px;font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
textarea{resize:vertical;min-height:60px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}

/* Glass utility */
.glass{background:var(--bg2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:var(--shadow)}

.app{height:100dvh;display:flex;flex-direction:column}
.header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,22,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-border);z-index:10}
.header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;gap:6px;align-items:center}
.header-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg3);backdrop-filter:blur(8px);border:1px solid var(--glass-border);transition:all .2s}
.header-btn:hover{background:var(--bg4);border-color:rgba(255,255,255,.15)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;padding-bottom:80px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,10,22,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--glass-border);padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:100}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:20px;color:var(--text3);transition:all .2s;border-radius:8px}
.nav button.active{color:var(--accent);background:var(--accent-glow)}
.nav button span{font-size:10px}
.card{background:var(--bg2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--glass-border);box-shadow:var(--shadow);transition:all .2s}
.card:hover{border-color:rgba(255,255,255,.12)}
.card-title{font-size:16px;font-weight:600;margin-bottom:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
.badge-accent{background:rgba(225,112,85,.15);color:var(--accent);border:1px solid rgba(225,112,85,.2)}
.badge-green{background:rgba(0,184,148,.15);color:var(--green);border:1px solid rgba(0,184,148,.2)}
.badge-blue{background:rgba(116,185,255,.15);color:var(--blue);border:1px solid rgba(116,185,255,.2)}
.badge-gold{background:rgba(255,215,0,.15);color:var(--gold);border:1px solid rgba(255,215,0,.2)}
.btn{padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;transition:all .2s;border:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 0 20px var(--accent-glow)}.btn-primary:hover{box-shadow:0 0 28px var(--accent-glow)}
.btn-secondary{background:var(--bg3);backdrop-filter:blur(8px);color:var(--text);border:1px solid var(--glass-border)}.btn-secondary:hover{background:var(--bg4);border-color:rgba(255,255,255,.15)}
.btn-outline{border:1px solid var(--accent);color:var(--accent);background:transparent}.btn-outline:hover{background:rgba(225,112,85,.08)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-block{width:100%;display:block;text-align:center}
.flex{display:flex}.flex-col{flex-direction:column}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-1{flex:1}
.text-center{text-align:center}.text-sm{font-size:13px}.text-xs{font-size:11px}
.text-muted{color:var(--text2)}.text-accent{color:var(--accent)}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hidden{display:none!important}
.page{display:none}.page.active{display:block}

/* Stat Card */
.stat-card{background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:14px;padding:14px;text-align:center;transition:all .2s}
.stat-card:hover{border-color:rgba(255,255,255,.12)}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-value{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Exercise items */
.exercise-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.exercise-item:hover{border-color:rgba(255,255,255,.15);background:rgba(26,26,62,.8)}
.exercise-item:active{transform:scale(.98)}
.exercise-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(225,112,85,.1);border:1px solid rgba(225,112,85,.15)}
.exercise-info{flex:1;min-width:0}
.exercise-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exercise-meta{font-size:11px;color:var(--text2);margin-top:2px}

/* Set rows */
.set-row{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg3);backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:10px;margin-bottom:6px;transition:all .2s}
.set-row.completed{background:rgba(0,184,148,.08);border-color:rgba(0,184,148,.2)}
.set-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg4);border:1px solid var(--glass-border)}
.set-row.completed .set-num{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 10px rgba(0,184,148,.3)}
.set-input{width:60px;text-align:center;padding:6px;font-size:14px;font-weight:600}

/* Timer */
.timer-display{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Rest overlay */
.rest-overlay{position:fixed;inset:0;background:rgba(10,10,22,.95);backdrop-filter:blur(20px);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.rest-timer{font-size:80px;font-weight:700;color:var(--accent);text-shadow:0 0 40px var(--accent-glow)}
.rest-progress{width:200px;height:200px;position:relative}
.rest-progress svg{transform:rotate(-90deg)}
.rest-progress circle{fill:none;stroke-width:6}
.rest-progress .bg{stroke:var(--bg3)}
.rest-progress .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s;filter:drop-shadow(0 0 6px var(--accent-glow))}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-header{font-size:11px;color:var(--text3);padding:4px}
.cal-day{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);cursor:pointer;transition:all .2s}
.cal-day.current-month{color:var(--text2)}
.cal-day.has-workout{background:rgba(225,112,85,.15);color:var(--accent);font-weight:600;border:1px solid rgba(225,112,85,.2)}
.cal-day.today{border:2px solid var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.cal-day.selected{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}
.cal-day:hover{background:rgba(255,255,255,.05)}

/* PR */
.pr-card{background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;transition:all .2s}
.pr-card:hover{border-color:rgba(255,255,255,.15)}
.pr-medal{font-size:24px}

/* Achievement */
.achievement{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:12px;margin-bottom:8px;opacity:.4;transition:all .3s}
.achievement.unlocked{opacity:1;background:rgba(255,215,0,.05);border-color:rgba(255,215,0,.2);box-shadow:0 0 12px rgba(255,215,0,.08)}
.achievement-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg4);border:1px solid var(--glass-border)}
.achievement.unlocked .achievement-icon{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.2)}

/* Streak */
.streak-fire{font-size:48px;text-align:center;margin-bottom:8px}
.streak-num{font-size:36px;font-weight:700;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Body measurement */
.measurement-row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg3);backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:10px;margin-bottom:6px}
.measurement-label{width:70px;font-size:13px;color:var(--text2)}
.measurement-value{font-size:18px;font-weight:700;flex:1}
.measurement-diff{font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px}
.measurement-diff.up{color:var(--green);background:rgba(0,184,148,.1)}.measurement-diff.down{color:var(--red);background:rgba(255,107,107,.1)}

/* Tabs */
.tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--bg2);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:12px;padding:4px}
.tab-btn{flex:1;padding:8px;text-align:center;border-radius:10px;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 16px var(--accent-glow)}
.tab-btn:hover:not(.active){color:var(--text2);background:rgba(255,255,255,.03)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,10,22,.85);backdrop-filter:blur(8px);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-content{background:rgba(18,18,42,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);backdrop-filter:blur(8px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.close-btn:hover{background:var(--bg4);border-color:rgba(255,255,255,.15)}

/* Search & filter */
.search-box{width:100%;padding:10px 14px;background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:12px;font-size:14px;color:var(--text);margin-bottom:12px}
.search-box::placeholder{color:var(--text3)}
.muscle-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.muscle-chip{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg3);border:1px solid var(--glass-border);color:var(--text3);cursor:pointer;transition:all .2s}
.muscle-chip.active{background:rgba(225,112,85,.15);color:var(--accent);border-color:rgba(225,112,85,.3);box-shadow:0 0 8px var(--accent-glow)}
.muscle-chip:hover:not(.active){color:var(--text2);border-color:rgba(255,255,255,.12)}

/* Template */
.template-card{padding:16px;background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:14px;cursor:pointer;transition:all .2s;margin-bottom:10px}
.template-card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.template-card:active{transform:scale(.98)}
.template-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.template-icon{font-size:28px}
.template-name{font-size:15px;font-weight:700}
.template-desc{font-size:12px;color:var(--text2)}

/* Chart */
.chart-container{background:var(--bg3);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:14px;padding:12px;margin-bottom:12px}
.chart-container canvas{width:100%;height:180px}

/* Settings row */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bg3);backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;margin-bottom:8px}
.settings-row label{font-size:14px;color:var(--text)}
.settings-row input[type="number"]{width:70px;text-align:center}

/* Animations */
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--accent-glow)}50%{box-shadow:0 0 24px var(--accent-glow)}}
.modal-content{animation:slideUp .3s ease}
.new-pr{animation:pop .4s ease}
.card{animation:fadeIn .3s ease}

/* Confetti */
.confetti{position:fixed;pointer-events:none;z-index:999}

/* Responsive */
@media(min-width:600px){
  .main{max-width:540px;margin:0 auto}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <h1>🏋️ ワークアウト</h1>
    <div class="header-actions">
      <div id="streak-badge" class="badge badge-accent" style="cursor:pointer" onclick="showPage('records')">🔥 0日</div>
      <button class="header-btn" onclick="openSettings()" title="設定">⚙</button>
    </div>
  </header>

  <div class="main" id="main-scroll">
    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="card" id="active-workout-card" style="display:none">
        <div class="flex justify-between items-center mb-8">
          <div class="card-title">🏃 トレーニング中</div>
          <div class="text-sm text-accent" id="home-workout-timer">00:00</div>
        </div>
        <div class="text-sm text-muted mb-8" id="home-workout-name"></div>
        <button class="btn btn-primary btn-block btn-sm" onclick="showPage('workout')">続ける</button>
      </div>

      <div class="card">
        <div class="card-title">📋 テンプレート</div>
        <div class="text-sm text-muted mb-8">ルーティンを選んで開始</div>
        <div id="template-list"></div>
      </div>

      <div class="card">
        <div class="card-title">📊 今週のサマリー</div>
        <div class="grid-3 mt-8" id="weekly-summary">
          <div class="stat-card"><div class="stat-label">回数</div><div class="stat-value" id="week-count">0</div></div>
          <div class="stat-card"><div class="stat-label">総ボリューム</div><div class="stat-value" id="week-volume">0</div></div>
          <div class="stat-card"><div class="stat-label">時間</div><div class="stat-value" id="week-time">0</div></div>
        </div>
      </div>

      <div class="card" id="recent-workouts-card" style="display:none">
        <div class="card-title">🕐 最近のワークアウト</div>
        <div id="recent-list"></div>
      </div>

      <button class="btn btn-outline btn-block mt-8" onclick="startCustomWorkout()">＋ カスタムワークアウト</button>
    </div>

    <!-- ACTIVE WORKOUT -->
    <div class="page" id="page-workout">
      <div class="flex justify-between items-center mb-16">
        <div>
          <div style="font-size:18px;font-weight:700" id="workout-title">ワークアウト</div>
          <div class="text-sm text-muted" id="workout-subtitle"></div>
        </div>
        <div class="timer-display" id="workout-timer" style="font-size:28px">00:00</div>
      </div>
      <div id="workout-exercises"></div>
      <div class="flex gap-8 mt-16">
        <button class="btn btn-secondary flex-1" onclick="addExerciseToWorkout()">＋ 種目追加</button>
        <button class="btn btn-primary flex-1" onclick="finishWorkout()">✓ 完了</button>
      </div>
      <button class="btn btn-block mt-8" style="color:var(--red)" onclick="cancelWorkout()">キャンセル</button>
    </div>

    <!-- LIBRARY -->
    <div class="page" id="page-library">
      <div class="card-title mb-8">📚 エクササイズライブラリ</div>
      <input class="search-box" placeholder="種目を検索..." oninput="filterLibrary(this.value)" id="lib-search">
      <div class="muscle-filter" id="muscle-filter"></div>
      <div id="library-list"></div>
    </div>

    <!-- HISTORY -->
    <div class="page" id="page-history">
      <div class="card-title mb-8">📅 トレーニング履歴</div>
      <div class="card">
        <div class="flex justify-between items-center mb-8">
          <button class="header-btn" onclick="calNav(-1)">◀</button>
          <div style="font-weight:600" id="cal-month"></div>
          <button class="header-btn" onclick="calNav(1)">▶</button>
        </div>
        <div class="cal-grid">
          <div class="cal-header">日</div><div class="cal-header">月</div><div class="cal-header">火</div>
          <div class="cal-header">水</div><div class="cal-header">木</div><div class="cal-header">金</div><div class="cal-header">土</div>
        </div>
        <div class="cal-grid" id="cal-days"></div>
      </div>
      <div id="history-detail"></div>
      <div class="chart-container mt-8">
        <div class="text-sm text-muted mb-8">📈 ボリューム推移（過去30日）</div>
        <canvas id="volume-chart" height="180"></canvas>
      </div>
    </div>

    <!-- RECORDS -->
    <div class="page" id="page-records">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchRecordTab('pr',this)">🏆 自己ベスト</button>
        <button class="tab-btn" onclick="switchRecordTab('body',this)">📏 ボディ</button>
        <button class="tab-btn" onclick="switchRecordTab('achieve',this)">🎖️ 実績</button>

function load(){
  try{
    const d=localStorage.getItem('workout_db');
    if(d){
      const parsed=JSON.parse(d);
      DB={...DB,...parsed};
      // Ensure settings has defaults
      DB.settings={restTime:60,restAutoStart:true,...(parsed.settings||{})};
    }
  }catch(e){}
  // Restore active workout from localStorage
  try{
    const saved=localStorage.getItem('active_workout');
    if(saved){
      const data=JSON.parse(saved);
      activeWorkout=data.workout;
      workoutStartTime=data.startTime;
      if(activeWorkout) workoutTimerInterval=setInterval(updateWorkoutTimer,1000);
    }
  }catch(e){}
}
function save(){ localStorage.setItem('workout_db',JSON.stringify(DB)); }
function saveActiveWorkout(){
  if(activeWorkout){
    localStorage.setItem('active_workout',JSON.stringify({workout:activeWorkout,startTime:workoutStartTime}));
  }else{
    localStorage.removeItem('active_workout');
  }
}
function getExercise(id){ return EXERCISES.find(e=>e.id===id); }
function dateKey(d){ return d.toISOString().slice(0,10); }
function today(){ return dateKey(new Date()); }
function fmtTime(sec){ const m=Math.floor(sec/60),s=Math.floor(sec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

// ===== AUDIO =====
function beep(freq=880,dur=0.15){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.3,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function tripleBeep(){beep(880,.12);setTimeout(()=>beep(880,.12),180);setTimeout(()=>beep(1200,.2),360);}

  if(id==='history') renderCalendar();
  if(id==='records') renderRecords();
  if(id==='home') renderHome();
  if(id==='library') renderLibrary();
  if(id==='workout') renderWorkout();
}

          <div class="template-desc">${t.desc}</div>
        </div>
      </div>
      <div class="text-xs text-muted">${t.exercises.length}種目 / ${t.exercises.reduce((a,e)=>a+e.sets.length,0)}セット</div>
    </div>
  `).join('');

  // Active workout indicator
  const ac=document.getElementById('active-workout-card');
  if(activeWorkout){
    ac.style.display='block';
    document.getElementById('home-workout-name').textContent=activeWorkout.name;
  }else{
    ac.style.display='none';
  }

  // Weekly summary
  const now=new Date();
  const weekStart=new Date(now);
  weekStart.setDate(now.getDate()-now.getDay());
  weekStart.setHours(0,0,0,0);
  const weekWorkouts=DB.history.filter(w=>{const d=new Date(w.date);return d>=weekStart;});
  document.getElementById('week-count').textContent=weekWorkouts.length;
  const vol=weekWorkouts.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+(s.weight||0)*(s.reps||0),0),0),0);
  document.getElementById('week-volume').textContent=vol>=1000?`${(vol/1000).toFixed(1)}t`:`${vol}kg`;
  const mins=weekWorkouts.reduce((a,w)=>a+Math.round((w.duration||0)/60),0);
  document.getElementById('week-time').textContent=`${mins}分`;

  // Recent workouts (last 3)
  const recentCard=document.getElementById('recent-workouts-card');
  const recentList=document.getElementById('recent-list');
  const recent=DB.history.slice(-3).reverse();
  if(recent.length){
    recentCard.style.display='block';
    recentList.innerHTML=recent.map(w=>{
      const vol=w.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.weight||0)*(s.reps||0),0),0);
      return `
        <div class="exercise-item" style="cursor:default">
          <div class="exercise-icon" style="font-size:16px">${w.name.includes('胸')?'🫁':w.name.includes('脚')?'🦵':w.name.includes('背中')?'🔙':w.name.includes('肩')?'🤷':w.name.includes('腕')?'💪':'🏋️'}</div>
          <div class="exercise-info">
            <div class="exercise-name">${w.name}</div>
            <div class="exercise-meta">${w.date} · ${fmtTime(w.duration)} · ${vol>=1000?(vol/1000).toFixed(1)+'t':vol+'kg'}</div>
          </div>
        </div>
      `;
    }).join('');
  }else{
    recentCard.style.display='none';
  }

  updateStreak();
}

// ===== STREAK =====
function calcStreak(){
  if(!DB.history.length) return 0;
  const dates=[...new Set(DB.history.map(w=>w.date))].sort().reverse();
  let streak=0;
  let check=new Date();
  if(!dates.includes(dateKey(check))){
    check.setDate(check.getDate()-1);
    if(!dates.includes(dateKey(check))) return 0;
  }
  while(dates.includes(dateKey(check))){
    streak++;
    check.setDate(check.getDate()-1);
  }
  return streak;
}
function updateStreak(){
  const s=calcStreak();
  document.getElementById('streak-badge').textContent=`🔥 ${s}日`;
  const sd=document.getElementById('streak-display');
  if(sd) sd.textContent=s;
}

// ===== TEMPLATES & WORKOUT START =====
function startTemplate(tid){
  const t=TEMPLATES.find(x=>x.id===tid);
  if(!t) return;
  if(activeWorkout){
    if(!confirm('現在のワークアウトを破棄して新しく始めますか？')) return;
    clearInterval(workoutTimerInterval);
  }
  activeWorkout={
    name:t.name,
    templateId:t.id,
    exercises:t.exercises.map(e=>{
      // Check history for previous weights
      const lastUsed=findLastUsed(e.id);
      return {
        id:e.id,
        sets:e.sets.map((s,i)=>({
          reps:lastUsed&&lastUsed.sets[i]?lastUsed.sets[i].reps:s.reps,
          weight:lastUsed&&lastUsed.sets[i]?lastUsed.sets[i].weight:s.weight,
          completed:false
        }))
      };
    })
  };
  beginWorkout();
}

function startCustomWorkout(){
  if(activeWorkout){
    if(!confirm('現在のワークアウトを破棄して新しく始めますか？')) return;
    clearInterval(workoutTimerInterval);
  }
  activeWorkout={name:'カスタムワークアウト',templateId:null,exercises:[]};
  beginWorkout();
  addExerciseToWorkout();
}

function beginWorkout(){
  workoutStartTime=Date.now();
  if(workoutTimerInterval) clearInterval(workoutTimerInterval);
  workoutTimerInterval=setInterval(updateWorkoutTimer,1000);
  saveActiveWorkout();
  showPage('workout');
  renderWorkout();
}

function updateWorkoutTimer(){
  if(!workoutStartTime) return;
  const elapsed=Math.floor((Date.now()-workoutStartTime)/1000);
  const display=fmtTime(elapsed);
  const wt=document.getElementById('workout-timer');
  if(wt) wt.textContent=display;
  const hwt=document.getElementById('home-workout-timer');
  if(hwt) hwt.textContent=display;
}

// ===== RENDER WORKOUT =====
function renderWorkout(){

  document.getElementById('workout-title').textContent=activeWorkout.name;
  const totalSets=activeWorkout.exercises.reduce((a,e)=>a+e.sets.length,0);
  const doneSets=activeWorkout.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.completed).length,0);
  document.getElementById('workout-subtitle').textContent=`${doneSets}/${totalSets} セット完了`;

  const container=document.getElementById('workout-exercises');
  container.innerHTML=activeWorkout.exercises.map((ex,ei)=>{
    const info=getExercise(ex.id);
    if(!info) return '';
    const isWeight=info.type==='weight';
    const isTime=info.type==='time';
    const isBW=info.type==='bodyweight';
    return `
      <div class="card">
        <div class="flex justify-between items-center mb-8">
          <div class="flex items-center gap-8">
            <span style="font-size:20px">${info.icon}</span>
            <div>
              <div style="font-weight:600;font-size:14px">${info.name}</div>
              <div class="text-xs text-muted">${info.muscle}${DB.prs[ex.id]?' · PR: '+DB.prs[ex.id].weight+'kg×'+DB.prs[ex.id].reps:''}</div>
            </div>
          </div>
          <button class="close-btn" onclick="removeExercise(${ei})" style="font-size:12px" title="種目を削除">✕</button>
        </div>
        <div class="flex items-center gap-8 mb-8 text-xs text-muted" style="padding:0 4px">
          <div style="width:28px;text-align:center">SET</div>
          ${isWeight?'<div style="width:60px;text-align:center">重量</div><div style="width:16px"></div><div style="width:8px"></div>':''}
          <div style="width:60px;text-align:center">${isTime?'秒数':'回数'}</div>
          <div style="flex:1"></div>
        </div>
        ${ex.sets.map((s,si)=>`
          <div class="set-row ${s.completed?'completed':''}" onclick="toggleSet(${ei},${si})">
            <div class="set-num">${si+1}</div>
            ${isWeight?`
              <input class="set-input" type="number" inputmode="decimal" value="${s.weight||''}" placeholder="kg"
                onclick="event.stopPropagation()" onchange="updateSet(${ei},${si},'weight',this.value)" step="0.5">
              <span class="text-xs text-muted">kg</span>
              <span class="text-xs text-muted">×</span>
            `:''}
            <input class="set-input" type="number" inputmode="numeric" value="${s.reps||''}"
              placeholder="${isTime?'秒':isBW?'回':'回'}"
              onclick="event.stopPropagation()" onchange="updateSet(${ei},${si},'reps',this.value)">
            <span class="text-xs text-muted">${isTime?'秒':'回'}</span>
            <div style="flex:1"></div>
            ${s.completed?'<span style="color:var(--green);font-size:16px">✓</span>':''}
          </div>
        `).join('')}
        <div class="flex gap-8 mt-8">
          <button class="btn btn-secondary btn-sm flex-1" onclick="addSet(${ei})">＋ セット</button>
          ${ex.sets.length>1?`<button class="btn btn-sm" style="color:var(--red);border:1px solid rgba(255,107,107,.2);border-radius:8px" onclick="removeSet(${ei})">− セット</button>`:''}
        </div>
      </div>
    `;
  }).join('');
}

function toggleSet(ei,si){
  const set=activeWorkout.exercises[ei].sets[si];
  set.completed=!set.completed;
  if(set.completed){
    beep(660,.1);
    // Auto rest timer if not all sets done for this exercise
    if(DB.settings.restAutoStart){
      const allDone=activeWorkout.exercises[ei].sets.every(s=>s.completed);
      if(!allDone) startRest(DB.settings.restTime||60);
    }
  }
  saveActiveWorkout();
  renderWorkout();
}

function updateSet(ei,si,field,val){
  activeWorkout.exercises[ei].sets[si][field]=parseFloat(val)||0;
  saveActiveWorkout();
}

function addSet(ei){
  const sets=activeWorkout.exercises[ei].sets;
  const last=sets[sets.length-1];
  sets.push({reps:last.reps,weight:last.weight,completed:false});
  saveActiveWorkout();
  renderWorkout();
}

function removeSet(ei){
  const sets=activeWorkout.exercises[ei].sets;
  if(sets.length>1) sets.pop();
  saveActiveWorkout();
  renderWorkout();
}

function removeExercise(ei){
  if(!confirm(`${getExercise(activeWorkout.exercises[ei].id)?.name || ''}を削除しますか？`)) return;
  activeWorkout.exercises.splice(ei,1);
  saveActiveWorkout();
  renderWorkout();
}

// ===== ADD EXERCISE MODAL =====
function addExerciseToWorkout(){
  let search='',muscle='全て';
  function render(){
    let filtered=EXERCISES;
    if(muscle!=='全て') filtered=filtered.filter(e=>e.muscle===muscle);
    if(search) filtered=filtered.filter(e=>e.name.includes(search)||e.en.toLowerCase().includes(search.toLowerCase()));
    document.getElementById('modal-content').innerHTML=`
      <div class="modal-title">種目を追加<button class="close-btn" onclick="closeModal()">✕</button></div>
      <input class="search-box" placeholder="種目を検索..." value="${search}" oninput="this.parentElement._search=this.value;this.parentElement._render()">
      <div class="muscle-filter">
        ${MUSCLES.map(m=>`<div class="muscle-chip ${m===muscle?'active':''}" onclick="this.parentElement.parentElement._muscle='${m}';this.parentElement.parentElement._render()">${m}</div>`).join('')}
      </div>
      <div style="max-height:50vh;overflow-y:auto">
        ${filtered.map(e=>`
          <div class="exercise-item" onclick="selectExercise('${e.id}')">
            <div class="exercise-icon">${e.icon}</div>
            <div class="exercise-info">
              <div class="exercise-name">${e.name}</div>
              <div class="exercise-meta">${e.en} · ${e.muscle}</div>
            </div>

function selectExercise(id){
  const info=getExercise(id);
  if(!info) return;
  const defaultSets=info.type==='time'?
    [{reps:30,weight:0,completed:false},{reps:30,weight:0,completed:false}]:
    info.type==='bodyweight'?
    [{reps:10,weight:0,completed:false},{reps:10,weight:0,completed:false},{reps:10,weight:0,completed:false}]:
    [{reps:10,weight:20,completed:false},{reps:10,weight:20,completed:false},{reps:10,weight:20,completed:false}];

  // Use last known weights from history
  const lastUsed=findLastUsed(id);
  if(lastUsed){
    defaultSets.forEach((s,i)=>{
      if(lastUsed.sets[i]){
        s.reps=lastUsed.sets[i].reps;
        s.weight=lastUsed.sets[i].weight;
      }
    });
  }

  activeWorkout.exercises.push({id,sets:defaultSets});
  saveActiveWorkout();
  closeModal();
  renderWorkout();
}

function findLastUsed(exId){
  for(let i=DB.history.length-1;i>=0;i--){
    const ex=DB.history[i].exercises.find(e=>e.id===exId);
    if(ex) return ex;
  }
  return null;
}

// ===== FINISH WORKOUT =====
function finishWorkout(){
  if(!activeWorkout||!activeWorkout.exercises.length) return;

  const duration=Math.floor((Date.now()-workoutStartTime)/1000);
  const completedExercises=activeWorkout.exercises.filter(e=>e.sets.some(s=>s.completed)).map(e=>({
    id:e.id,
    sets:e.sets.filter(s=>s.completed).map(s=>({reps:s.reps,weight:s.weight}))
  }));

  if(!completedExercises.length){
    if(!confirm('完了したセットがありません。キャンセルしますか？')) return;
    cancelWorkout();return;
  }

  const record={
    date:today(),
    timestamp:Date.now(),
    name:activeWorkout.name,
    templateId:activeWorkout.templateId,
    duration,
    exercises:completedExercises,
    note:activeWorkout.note||''
  };

  // Check PRs
  let newPRs=[];
  completedExercises.forEach(ex=>{
    const info=getExercise(ex.id);
    if(!info||info.type==='time'||info.type==='cardio') return;
    ex.sets.forEach(s=>{
      const vol=s.weight*s.reps;
      const current=DB.prs[ex.id];
      if(!current||vol>current.weight*current.reps){
        DB.prs[ex.id]={weight:s.weight,reps:s.reps,date:today()};
        newPRs.push({name:info.name,weight:s.weight,reps:s.reps});
      }
      if(!current||s.weight>(current.maxWeight||0)){
        if(!DB.prs[ex.id]) DB.prs[ex.id]={weight:s.weight,reps:s.reps,date:today()};
        DB.prs[ex.id].maxWeight=s.weight;
      }
    });
  });

  DB.history.push(record);

  // Check achievements
  checkAchievements();
  save();

  // Clear workout
  clearInterval(workoutTimerInterval);
  activeWorkout=null;
  workoutStartTime=null;
  saveActiveWorkout();

  // Show summary
  showFinishSummary(record,newPRs);
}

  openModal();
  document.getElementById('modal-content').innerHTML=`
    <div class="text-center mb-16">
      <div style="font-size:48px;margin-bottom:8px">🎉</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">ワークアウト完了！</div>
      <div class="text-sm text-muted">${record.name}</div>
    </div>
    <div class="grid-3 mb-16">
      <div class="stat-card">
        <div class="stat-label">時間</div>
        <div class="stat-value" style="font-size:18px">${fmtTime(record.duration)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">セット</div>
        <div class="stat-value" style="font-size:18px">${sets}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ボリューム</div>
        <div class="stat-value" style="font-size:18px">${vol>=1000?(vol/1000).toFixed(1)+'t':vol+'kg'}</div>
      </div>
    </div>
    ${newPRs.length?`
      <div class="card mb-16" style="border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,.1)">
        <div class="card-title">🏆 新記録！</div>
        ${newPRs.map(p=>`
          <div class="pr-card mb-8 new-pr">
            <div class="pr-medal">🥇</div>
            <div>
              <div style="font-weight:600">${p.name}</div>
              <div class="text-sm text-accent">${p.weight}kg × ${p.reps}回</div>
            </div>
          </div>
        `).join('')}
      </div>
    `:''}
    <button class="btn btn-primary btn-block" onclick="closeModal();showPage('home')">閉じる</button>
  `;

  if(newPRs.length) tripleBeep();
}

function cancelWorkout(){
  if(activeWorkout && activeWorkout.exercises.some(e=>e.sets.some(s=>s.completed))){
    if(!confirm('トレーニングを中断しますか？記録は保存されません。')) return;
  }
  clearInterval(workoutTimerInterval);
  activeWorkout=null;workoutStartTime=null;
  saveActiveWorkout();
  showPage('home');
}

// ===== REST TIMER =====
function startRest(seconds){
  restTotal=seconds;restRemaining=seconds;
  document.getElementById('rest-overlay').classList.remove('hidden');
  updateRestDisplay();
  if(restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval=setInterval(()=>{
    restRemaining--;
    if(restRemaining<=0){skipRest();tripleBeep();return;}
    if(restRemaining<=3) beep(440,.08);
    updateRestDisplay();
  },1000);
}

function updateRestDisplay(){
  document.getElementById('rest-time').textContent=restRemaining;
  const circ=565.48;
  const offset=circ*(1-restRemaining/restTotal);
  document.getElementById('rest-arc').style.strokeDashoffset=offset;
}

function adjustRest(delta){
  restRemaining=Math.max(0,restRemaining+delta);
  restTotal=Math.max(restTotal,restRemaining);
  updateRestDisplay();
}

function skipRest(){
  clearInterval(restTimerInterval);
  document.getElementById('rest-overlay').classList.add('hidden');
}

// ===== HISTORY & CALENDAR =====
function renderCalendar(){
  const now=new Date();
  if(!calYear){calYear=now.getFullYear();calMonth=now.getMonth();}
  document.getElementById('cal-month').textContent=`${calYear}年${calMonth+1}月`;

  const first=new Date(calYear,calMonth,1);
  const last=new Date(calYear,calMonth+1,0);
  const startDay=first.getDay();
  const daysInMonth=last.getDate();

  const workoutDates=new Set(DB.history.map(w=>w.date));
  const todayStr=today();

  let html='';
  const prevLast=new Date(calYear,calMonth,0).getDate();
  for(let i=startDay-1;i>=0;i--){
    html+=`<div class="cal-day">${prevLast-i}</div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const dk=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cal-day','current-month'];
    if(workoutDates.has(dk)) cls.push('has-workout');
    if(dk===todayStr) cls.push('today');
    html+=`<div class="${cls.join(' ')}" onclick="showDayDetail('${dk}',this)">${d}</div>`;
  }
  const remaining=(7-(startDay+daysInMonth)%7)%7;
  for(let i=1;i<=remaining;i++){
    html+=`<div class="cal-day">${i}</div>`;
  }

  document.getElementById('cal-days').innerHTML=html;
  renderVolumeChart();
}

function calNav(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}

            const info=getExercise(e.id);
            return `<div class="exercise-item" style="cursor:default">
              <div class="exercise-icon">${info?info.icon:'?'}</div>
              <div class="exercise-info">
                <div class="exercise-name">${info?info.name:e.id}</div>
                <div class="exercise-meta">${e.sets.map(s=>`${s.weight?s.weight+'kg×':''}${s.reps}回`).join(' / ')}</div>
              </div>
            </div>`;
          }).join('')}
          <div class="flex justify-between mt-8">
            <span class="badge badge-accent">ボリューム: ${vol>=1000?(vol/1000).toFixed(1)+'t':vol+'kg'}</span>
            <button class="btn btn-sm" style="color:var(--red)" onclick="deleteWorkout(${w.timestamp})">削除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Highlight selected day
  document.querySelectorAll('.cal-day').forEach(d=>d.classList.remove('selected'));
  if(el) el.classList.add('selected');
}

function deleteWorkout(timestamp){
  if(!confirm('この記録を削除しますか？')) return;
  DB.history=DB.history.filter(w=>w.timestamp!==timestamp);
  save();renderCalendar();
  document.getElementById('history-detail').innerHTML='';
}

// ===== VOLUME CHART =====
function renderVolumeChart(){
  const canvas=document.getElementById('volume-chart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*dpr;
  canvas.height=180*dpr;
  ctx.scale(dpr,dpr);
  const W=canvas.clientWidth,H=180;

  ctx.clearRect(0,0,W,H);

  // Last 30 days
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const dk=dateKey(d);
    const vol=DB.history.filter(w=>w.date===dk).reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+(s.weight||0)*(s.reps||0),0),0),0);
    days.push({date:dk,vol,label:d.getDate()});
  }

  const maxVol=Math.max(...days.map(d=>d.vol),1);
  const padL=40,padR=10,padT=10,padB=30;
  const chartW=W-padL-padR,chartH=H-padT-padB;

  // Grid
  ctx.strokeStyle='rgba(34,34,85,.8)';ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=padT+chartH*(1-i/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillStyle='#606080';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText(Math.round(maxVol*i/4)+'kg',padL-4,y+4);
  }

  // Bars
  const barW=chartW/days.length*0.7;
  const gap=chartW/days.length;
  days.forEach((d,i)=>{
    const x=padL+i*gap+gap*0.15;
    const h=(d.vol/maxVol)*chartH;
    if(d.vol>0){
      const grad=ctx.createLinearGradient(x,padT+chartH-h,x,padT+chartH);
      grad.addColorStop(0,'#e17055');grad.addColorStop(1,'rgba(225,112,85,.15)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      if(ctx.roundRect){
        ctx.roundRect(x,padT+chartH-h,barW,h,[3,3,0,0]);
      }else{
        ctx.rect(x,padT+chartH-h,barW,h);
      }
      ctx.fill();
    }
    if(i%5===0||i===29){
      ctx.fillStyle='#606080';ctx.font='9px sans-serif';ctx.textAlign='center';
      ctx.fillText(d.label,x+barW/2,H-8);
    }
  });
}

// ===== RECORDS =====

function renderRecords(){

function renderPRs(){

// ===== BODY MEASUREMENTS =====
function renderBody(){
  const container=document.getElementById('body-measurements');
  const latest={};
  const prev={};
  DB.body.forEach(entry=>{
    BODY_PARTS.forEach(bp=>{
      if(entry[bp.id]!==undefined&&entry[bp.id]!==null&&entry[bp.id]!==''){
        if(!latest[bp.id]||entry.date>=latest[bp.id].date){
          prev[bp.id]=latest[bp.id];
          latest[bp.id]={value:entry[bp.id],date:entry.date};
        }
      }
    });
  });

  container.innerHTML=BODY_PARTS.map(bp=>{
    const l=latest[bp.id];
    const p=prev[bp.id];
    const diff=l&&p?(l.value-p.value).toFixed(1):null;
    return `
      <div class="measurement-row">
        <div class="measurement-label">${bp.name}</div>
        <div class="measurement-value">${l?l.value+bp.unit:'--'}</div>
        ${diff?`<div class="measurement-diff ${parseFloat(diff)>0?'up':'down'}">${parseFloat(diff)>0?'↑':'↓'}${Math.abs(diff)}${bp.unit}</div>`:''}
      </div>
    `;
  }).join('');

  renderBodyChart();
}

function openBodyModal(){
  openModal();
  const todayVal=today();
  // Pre-fill with latest values
  const latestVals={};
  DB.body.forEach(entry=>{
    BODY_PARTS.forEach(bp=>{

function saveBody(){
  const entry={date:document.getElementById('body-date').value};
  let hasValue=false;
  BODY_PARTS.forEach(bp=>{
    const v=document.getElementById('body-'+bp.id).value;
    if(v){entry[bp.id]=parseFloat(v);hasValue=true;}
  });
  if(!hasValue){alert('少なくとも1つの値を入力してください');return;}
  DB.body.push(entry);
  save();closeModal();renderBody();
}

function renderBodyChart(){
  const canvas=document.getElementById('body-chart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*dpr;
  canvas.height=180*dpr;
  ctx.scale(dpr,dpr);
  const W=canvas.clientWidth,H=180;
  ctx.clearRect(0,0,W,H);

  if(DB.body.length<2){
    ctx.fillStyle='#606080';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('2回以上の計測でトレンドを表示',W/2,H/2);
    return;
  }

  const weightData=DB.body.filter(b=>b.weight_body).sort((a,b)=>a.date.localeCompare(b.date));
  if(weightData.length<2){
    ctx.fillStyle='#606080';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('体重データが2件以上必要です',W/2,H/2);
    return;
  }

  const padL=40,padR=10,padT=15,padB=30;
  const vals=weightData.map(d=>d.weight_body);
  const minV=Math.min(...vals)-1,maxV=Math.max(...vals)+1;
  const chartW=W-padL-padR,chartH=H-padT-padB;

  // Grid
  ctx.strokeStyle='rgba(34,34,85,.8)';ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=padT+chartH*(1-i/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillStyle='#606080';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText((minV+(maxV-minV)*i/4).toFixed(1)+'kg',padL-4,y+4);
  }

  // Area fill
  ctx.beginPath();
  weightData.forEach((d,i)=>{
    const x=padL+(i/(weightData.length-1))*chartW;
    const y=padT+chartH*(1-(d.weight_body-minV)/(maxV-minV));
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+chartW,padT+chartH);
  ctx.lineTo(padL,padT+chartH);
  ctx.closePath();
  const areaGrad=ctx.createLinearGradient(0,padT,0,padT+chartH);
  areaGrad.addColorStop(0,'rgba(225,112,85,.2)');
  areaGrad.addColorStop(1,'rgba(225,112,85,.02)');
  ctx.fillStyle=areaGrad;
  ctx.fill();

  // Line
  ctx.beginPath();
  weightData.forEach((d,i)=>{
    const x=padL+(i/(weightData.length-1))*chartW;
    const y=padT+chartH*(1-(d.weight_body-minV)/(maxV-minV));
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#e17055';ctx.lineWidth=2;ctx.stroke();

  // Points
  weightData.forEach((d,i)=>{
    const x=padL+(i/(weightData.length-1))*chartW;
    const y=padT+chartH*(1-(d.weight_body-minV)/(maxV-minV));
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#e17055';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  });

  ctx.fillStyle='#9090b0';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('体重推移',W/2,H-4);
}

// ===== ACHIEVEMENTS =====
function getStats(){
  const total=DB.history.length;
  const streak=calcStreak();
  const totalVol=DB.history.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+(s.weight||0)*(s.reps||0),0),0),0);
  const prCount=Object.keys(DB.prs).length;
  const earlyBird=DB.history.some(w=>{const h=new Date(w.timestamp).getHours();return h<6;});
  const nightOwl=DB.history.some(w=>{const h=new Date(w.timestamp).getHours();return h>=23;});
  return{total,streak,totalVol,prCount,earlyBird,nightOwl};
}

function checkAchievements(){
  const stats=getStats();
  ACHIEVEMENTS.forEach(a=>{
    if(!DB.achievements.includes(a.id)&&a.check(stats)){
      DB.achievements.push(a.id);
    }
  });
}

function renderAchievements(){
  updateStreak();
  const container=document.getElementById('achievement-list');
  const unlocked=DB.achievements.length;
  const total=ACHIEVEMENTS.length;
  container.innerHTML=`
    <div class="text-sm text-muted mb-16 text-center">${unlocked}/${total} 達成</div>
    ${ACHIEVEMENTS.map(a=>{
      const ul=DB.achievements.includes(a.id);
      return `
        <div class="achievement ${ul?'unlocked':''}">
          <div class="achievement-icon">${a.icon}</div>
          <div class="flex-1">
            <div style="font-weight:600;font-size:14px">${a.name}</div>
            <div class="text-xs text-muted">${a.desc}</div>
          </div>
          ${ul?'<span class="badge badge-gold">達成</span>':'<span class="badge" style="background:var(--bg4);color:var(--text3)">未達成</span>'}
        </div>
      `;
    }).join('')}
  `;
}

}

function saveSettings(){
  DB.settings.restTime=parseInt(document.getElementById('set-rest-time').value)||60;
  DB.settings.restAutoStart=document.getElementById('set-rest-auto').checked;
  save();closeModal();
}

function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`workout-backup-${today()}.json`;
  a.click();URL.revokeObjectURL(url);
}

function importData(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.history||data.prs){
        if(confirm(`データをインポートしますか？\n履歴: ${(data.history||[]).length}件\n自己ベスト: ${Object.keys(data.prs||{}).length}件`)){
          DB={...DB,...data};
          DB.settings={restTime:60,restAutoStart:true,...(data.settings||{})};
          save();
          renderHome();
          closeModal();
          alert('インポート完了');
        }
      }else{
        alert('有効なワークアウトデータではありません');
      }
    }catch(err){alert('ファイルの読み込みに失敗しました');}
  };
  reader.readAsText(file);
  event.target.value='';
}

function clearAllData(){
  DB={history:[],prs:{},body:[],achievements:[],settings:{restTime:60,restAutoStart:true}};
  save();closeModal();renderHome();
}

// ===== MODAL =====
function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

// ===== AUTO-SAVE ACTIVE WORKOUT =====
setInterval(()=>{ saveActiveWorkout(); },10000);

// ===== CANVAS ROUNDRECT POLYFILL =====
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(!Array.isArray(r)) r=[r,r,r,r];
    this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);this.quadraticCurveTo(x,y,x+r[0],y);this.closePath();
    return this;
  };
}

// ===== SERVICE WORKER =====
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='workout-v2';
    self.addEventListener('install',e=>{self.skipWaiting()});
    self.addEventListener('activate',e=>{
      e.waitUntil(
        caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))
        .then(()=>clients.claim())
      )
    });
    self.addEventListener('fetch',e=>{
      e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
        if(resp.status===200){const c=resp.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));}
        return resp;
      }).catch(()=>caches.match('/'))))
    });
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
